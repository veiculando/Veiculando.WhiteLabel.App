name: CI

# Chamador dos workflows reutilizaveis mantidos em veiculando/.github.
#
# Este repositorio e autocontido: nao depende do core, entao nao precisa de
# secret nem de checkout adicional.

on:
  pull_request:
  push:
    branches:
      - master
      - 'sprint-*'

jobs:
  angular:
    uses: veiculando/.github/.github/workflows/_angular-ci.yml@main
    with:
      # Toolchain da Sprint 9.0: o codigo desta branch nao constroi no Node 20.
      node-version: '22.22.3'
      test-runner: vitest

  security:
    uses: veiculando/.github/.github/workflows/_security-ci.yml@main
    with:
      # Ligado: este repositorio e PUBLICO, e dependency review e gratuito em
      # repositorio publico. A branch de sprint desligou isto justificando
      # "repositorio privado no GitHub Free", o que nao corresponde a este
      # repositorio - a premissa estava errada, nao a decisao.
      dependency-review: true
