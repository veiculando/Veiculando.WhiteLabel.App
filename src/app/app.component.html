<div
  *ngIf="brand() as branding"
  class="container"
  style="max-width: var(--container-max-width); margin: 0 auto; padding: var(--padding-section);"
>
  <header>
    <img [src]="branding.logoUrl" [alt]="'Logo ' + branding.nomeExibicao" height="48" />
    <h1>{{ branding.nomeExibicao }}</h1>
  </header>

  <router-outlet></router-outlet>

  <footer>{{ branding.footerText || branding.nomeExibicao }}</footer>
</div>
