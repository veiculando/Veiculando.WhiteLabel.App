@if (brand(); as branding) {
  <main class="portal">
    <section class="portal__card">
      <div class="portal__marca">
        <img [src]="branding.logoUrl" [alt]="'Logo ' + branding.nomeExibicao" />
        <span>Portal WhiteLabel</span>
      </div>

      <div class="portal__linha"></div>
      <p class="portal__sobretitulo">Identidade conectada ao seu domínio</p>
      <h1>{{ branding.nomeExibicao }}</h1>
      <p class="portal__descricao">
        A experiência do anunciante será apresentada aqui com a identidade da sua operação.
      </p>

      <router-outlet></router-outlet>

      <footer>{{ branding.footerText || branding.nomeExibicao }}</footer>
    </section>
  </main>
}
